<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon biasa (tab browser) -->
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ujian Siswa</title>

    <!-- ===== PWA: Android / Chrome ===== -->
    <!-- manifest di-inject otomatis oleh vite-plugin-pwa saat build,
         tapi link ini aman ditulis manual juga untuk dev server -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d2a63" />

    <!-- ===== PWA: iOS Safari ===== -->
    <!-- iOS TIDAK membaca manifest.json sama sekali untuk mode
         standalone -- wajib pakai meta tag ini -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Ruang Ujian" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
